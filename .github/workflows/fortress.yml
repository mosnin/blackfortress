name: Black Fortress

on:
  pull_request:
    paths:
      - 'fortress/**'
      - 'probo/**'
      - 'packages/integration-platform/**'
      - '.github/workflows/fortress.yml'
  push:
    branches: [main]
    paths:
      - 'fortress/**'
      - 'probo/**'
      - 'packages/integration-platform/**'
      - '.github/workflows/fortress.yml'

permissions:
  contents: read

concurrency:
  group: fortress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source without retaining credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: probo/go.mod
          cache-dependency-path: |
            fortress/bfd/go.sum
            fortress/library/validate/go.sum

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: probo/.nvmrc

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'

      - name: bfd vet and tests
        working-directory: fortress/bfd
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: Framework library validates against Probo's importer
        working-directory: fortress/library
        run: |
          node scripts/convert-comp.mjs
          git diff --exit-code -- frameworks crosswalk.json processes manifest.json
          cd validate && go test ./...

      - name: bf-checks tests and typecheck
        working-directory: fortress/checks
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck

  smoke:
    name: runtime smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: unit
    steps:
      - name: Checkout source without retaining credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: probo/go.mod
          cache-dependency-path: |
            probo/go.sum
            fortress/bfd/go.sum

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: probo/.nvmrc

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'

      - name: Ensure PostgreSQL 16 binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi

      - name: Build runtime (probod, bfd, bf, bf-checks, library)
        run: fortress/scripts/build-runtime.sh linux-amd64

      - name: Smoke test a fresh install
        run: fortress/scripts/smoke-test.sh fortress/bfd/dist/linux-amd64
